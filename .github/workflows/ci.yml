name: build

on:
  push:
    branches: [master, 'fix/**']
  pull_request:

jobs:
  net-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Unit tests
        run: ./gradlew :net:testDebugUnitTest --stacktrace
      - name: Forbid OkHttp internal API
        run: |
          set -euo pipefail
          hits="$(rg -n 'import okhttp3\.internal|class OkHttpUtils|getTags\$okhttp|getHeaders\$okhttp|getCache\$okhttp|addLenient\$okhttp' \
            --glob '*.kt' --glob '*.java' net/src/main || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "Found OkHttp internal API usage in net/src/main"
            exit 1
          fi
          echo "OK: no OkHttp internal API in production sources"
