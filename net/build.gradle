apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: 'org.jetbrains.dokka'
apply plugin: 'maven-publish'

def netPublishGroup = "com.github.rocker027"
def netPublishArtifact = "Net"
def netPublishVersion = "3.7.0-compat.1"

android {
    compileSdkVersion 30
    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 30
        versionCode 1
        versionName netPublishVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    kotlinOptions {
        freeCompilerArgs = ["-Xinline-classes", "-Xallow-result-return-type"]
    }

    dokkaHtml {
        outputDirectory.set(file("$rootDir/docs/api"))
        suppressInheritedMembers.set(true)
        moduleName.set("Net")
    }
}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.startup:startup-runtime:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"

    compileOnly "com.squareup.okhttp3:okhttp:$okhttp_version"

    compileOnly "com.github.liangjingkanji:BRV:$brv_version"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutine_version"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutine_version"

    testImplementation "junit:junit:4.13.2"
    testImplementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutine_version"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = netPublishGroup
                artifactId = netPublishArtifact
                version = netPublishVersion

                pom {
                    name = "Net (compat fork)"
                    description = "Maintenance fork of liangjingkanji/Net 3.7.0 with OkHttp public API, cancellation, and request-level base URL."
                    url = "https://github.com/rocker027/Net"
                    licenses {
                        license {
                            name = "MIT License"
                            url = "https://opensource.org/licenses/MIT"
                        }
                    }
                }
            }
        }
        repositories {
            maven {
                name = "LocalDist"
                url = uri("${rootProject.projectDir}/dist/maven")
            }
        }
    }
}
